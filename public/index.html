<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beside - Stranger Live Connect</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    #phone-container { width: 100%; max-width: 440px; height: 100vh; background: #111827; display: flex; flex-direction: column; position: relative; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; box-shadow: 0 0 50px rgba(0,0,0,0.6); }

    .view-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .hidden { display: none !important; }

    /* Top Bar */
    .top-navbar { height: 64px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .logo-text { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
   
    .profile-pill { display: flex; align-items: center; gap: 8px; background: #1e293b; padding: 4px 12px 4px 6px; border-radius: 30px; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; }
    .profile-pill:hover { border-color: #06b6d4; }
    .profile-pill img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #06b6d4; }
    .profile-pill .name { font-size: 13px; font-weight: 600; color: #f8fafc; }
    .profile-pill .camera-badge { font-size: 11px; color: #38bdf8; }

    /* Nearby Grid (Beside Look) */
    #screen-discovery { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 80%); }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .pill-nearby { background: #10b981; color: #ffffff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; letter-spacing: 0.5px; }

    .users-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; margin-top: 10px; }
    .beside-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
    .beside-card:hover { transform: scale(1.08); }
    .avatar-ring { width: 80px; height: 80px; border-radius: 50%; padding: 3px; border: 3px solid #10b981; display: flex; align-items: center; justify-content: center; background: #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .avatar-ring.alt-ring { border-color: #8b5cf6; }
    .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .beside-card .user-title { margin-top: 6px; font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .beside-card .user-dist { font-size: 10px; color: #38bdf8; font-weight: 500; }

    /* Bottom Nav Bar */
    .bottom-tabs { height: 60px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; align-items: center; }
    .tab-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #64748b; font-weight: 600; cursor: pointer; transition: color 0.2s; }
    .tab-item.active { color: #06b6d4; }
    .tab-item span { font-size: 18px; margin-bottom: 2px; }

    /* Chats List Screen */
    #screen-chats-list { padding: 16px; overflow-y: auto; background: #0f172a; }
    .chat-inbox-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #1e293b; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid #334155; }
    .chat-inbox-item img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #06b6d4; }
    .inbox-info { flex: 1; }
    .inbox-name { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .inbox-sub { font-size: 11px; color: #94a3b8; }

    /* Request Banner Alert */
    #request-popup { position: absolute; top: 72px; left: 14px; right: 14px; background: #1e293b; border-radius: 16px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border-left: 5px solid #10b981; border: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .btn-action { border: none; padding: 7px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-acc { background: #10b981; color: white; margin-right: 5px; }
    .btn-rej { background: #ef4444; color: white; }

    /* 1-on-1 Chat Room Screen */
    #screen-chat-room { background: #0b0f19; }
    .chat-header { height: 65px; background: #0f172a; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid #1e293b; }
    .peer-meta { display: flex; align-items: center; gap: 10px; }
    .btn-back { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
    .peer-meta img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #06b6d4; }
    .peer-meta .meta-name { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .peer-meta .meta-status { font-size: 11px; color: #10b981; }

    .btn-clear-chat { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

    .chat-messages-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: radial-gradient(circle at center, #111827 0%, #0b0f19 100%); }
    .chat-bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; }
    .bubble-out { align-self: flex-end; background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff; border-bottom-right-radius: 2px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25); }
    .bubble-in { align-self: flex-start; background: #1e293b; color: #f1f5f9; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    .bubble-time { font-size: 10px; color: rgba(255,255,255,0.6); align-self: flex-end; margin-top: 4px; }
    .bubble-sticker { max-width: 140px; max-height: 140px; border-radius: 12px; }

    #typing-bar { font-size: 11px; color: #38bdf8; font-style: italic; padding: 0 16px; margin-bottom: 6px; }

    /* Footer Inputs */
    .chat-footer { height: 65px; background: #0f172a; display: flex; align-items: center; padding: 0 12px; gap: 8px; border-top: 1px solid #1e293b; }
    .btn-emoji-toggle { background: none; border: none; font-size: 24px; cursor: pointer; }
    .text-chat-input { flex: 1; height: 42px; background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 0 16px; font-size: 14px; color: #f8fafc; outline: none; }
    .text-chat-input:focus { border-color: #06b6d4; }
    .btn-send { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #3b82f6); border: none; color: #0f172a; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Sticker Tray */
    #sticker-panel { height: 180px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; overflow-y: auto; }
    .sticker-unit { width: 60px; height: 60px; cursor: pointer; object-fit: contain; transition: transform 0.15s; border-radius: 8px; background: #1e293b; padding: 4px; }
    .sticker-unit:hover { transform: scale(1.18); }

    #hidden-dp-upload { display: none; }
  </style>
</head>
<body>

  <div id="phone-container">
    <!-- Top Bar -->
    <div class="top-navbar">
      <div class="logo-text">Beside</div>
     
      <!-- Upload DP on click -->
      <label for="hidden-dp-upload" class="profile-pill" title="Click to upload your Profile Photo">
        <img id="my-dp-preview" src="" alt="my photo">
        <span id="my-name-tag" class="name">You</span>
        <span class="camera-badge">📷</span>
      </label>
      <input type="file" id="hidden-dp-upload" accept="image/*" onchange="handleDpUpload(event)">
    </div>

    <!-- Request Popup Alert -->
    <div id="request-popup" class="hidden">
      <div>
        <strong id="req-user-name" style="color:#f8fafc; font-size:14px;">User</strong>
        <p style="font-size:11px; color:#94a3b8;" id="req-user-dist">500 km away wants to chat</p>
      </div>
      <div>
        <button class="btn-action btn-acc" onclick="answerRequest(true)">Accept</button>
        <button class="btn-action btn-rej" onclick="answerRequest(false)">Reject</button>
      </div>
    </div>

    <!-- 1. DISCOVERY VIEW (NEARBY 1KM - 500+KM) -->
    <div id="screen-discovery" class="view-screen">
      <div class="section-header">
        <span style="font-size:14px; font-weight:700; color:#cbd5e1;">Live Discovery</span>
        <div class="pill-nearby">ANYWHERE / 500KM+</div>
      </div>
      <p style="font-size:12px; color:#64748b; margin-bottom:8px;">Tap any stranger to connect privately</p>

      <div class="users-grid" id="discovery-grid"></div>
    </div>

    <!-- 2. CHATS TAB VIEW -->
    <div id="screen-chats-list" class="view-screen hidden">
      <h3 style="font-size:16px; margin-bottom:14px; color:#cbd5e1;">Active Sessions</h3>
      <div id="active-chats-container">
        <p style="font-size:12px; color:#64748b; text-align:center; margin-top:40px;">No active conversations yet.<br>Go to Nearby & connect!</p>
      </div>
    </div>

    <!-- 3. PRIVATE 1-ON-1 CHAT SCREEN -->
    <div id="screen-chat-room" class="view-screen hidden">
      <div class="chat-header">
        <div class="peer-meta">
          <button class="btn-back" onclick="closeChatScreen()">←</button>
          <img id="chat-peer-dp" src="" alt="avatar">
          <div>
            <div id="chat-peer-name" class="meta-name">Stranger</div>
            <div class="meta-status">🔒 Private Encrypted Room</div>
          </div>
        </div>
        <!-- Delete For Me Only -->
        <button class="btn-clear-chat" onclick="deleteMyChatMessages()">🗑️ Clear for Me</button>
      </div>

      <div class="chat-messages-scroll" id="chat-messages-flow"></div>
      <div id="typing-bar" class="hidden">typing...</div>

      <!-- Stickers Drawer -->
      <div id="sticker-panel" class="hidden">
        <img class="sticker-unit" src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" onclick="sendStickerDirect(this.src)" title="Shocked Cat">
        <img class="sticker-unit" src="https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" onclick="sendStickerDirect(this.src)" title="Dancing Dog">
        <img class="sticker-unit" src="https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif" onclick="sendStickerDirect(this.src)" title="Popcorn Cat">
        <img class="sticker-unit" src="https://media.giphy.com/media/13HgwGsXF0aiGY/giphy.gif" onclick="sendStickerDirect(this.src)" title="Laughing Dog">
        <img class="sticker-unit" src="https://media.giphy.com/media/26AHONQ79FdWZhAI0/giphy.gif" onclick="sendStickerDirect(this.src)" title="Excited Dance">
        <img class="sticker-unit" src="https://media.giphy.com/media/ule4akeEDWAYE/giphy.gif" onclick="sendStickerDirect(this.src)" title="LOL Laugh">
        <img class="sticker-unit" src="https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif" onclick="sendStickerDirect(this.src)" title="Blinking Guy">
        <img class="sticker-unit" src="https://media.giphy.com/media/unQ3IJU2RG7DO/giphy.gif" onclick="sendStickerDirect(this.src)" title="Side Eye">
        <img class="sticker-unit" src="https://media.giphy.com/media/26n6WywJyh39n1pBu/giphy.gif" onclick="sendStickerDirect(this.src)" title="Thumbs Up">
        <img class="sticker-unit" src="https://media.giphy.com/media/l4KibWpBGWchSqCRy/giphy.gif" onclick="sendStickerDirect(this.src)" title="Mind Blown">
      </div>

      <div class="chat-footer">
        <button class="btn-emoji-toggle" onclick="toggleStickersTray()">😄</button>
        <input type="text" id="chat-input" class="text-chat-input" placeholder="Type a message..." oninput="handleTypingNotification()" onkeypress="handleEnter(event)">
        <button class="btn-send" onclick="sendTextMessage()">➤</button>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-tabs">
      <div id="tab-nearby" class="tab-item active" onclick="switchMainTab('nearby')">
        <span>📍</span>
        <div>Nearby</div>
      </div>
      <div id="tab-chats" class="tab-item" onclick="switchMainTab('chats')">
        <span>💬</span>
        <div>Chats</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    // Persistent profile setup using LocalStorage
    let savedName = localStorage.getItem('stranger_my_name') || prompt("Enter your Name:") || `User_${Math.floor(Math.random() * 900 + 100)}`;
    let savedAvatar = localStorage.getItem('stranger_my_avatar') || `https://api.dicebear.com/7.x/bottts/svg?seed=${savedName}`;

    localStorage.setItem('stranger_my_name', savedName);
    localStorage.setItem('stranger_my_avatar', savedAvatar);

    let myProfile = { name: savedName, avatar: savedAvatar };
    document.getElementById('my-name-tag').innerText = myProfile.name;
    document.getElementById('my-dp-preview').src = myProfile.avatar;

    // Chat states
    let activeSession = null; // { roomId, peerId, peerName, peerAvatar }
    let chatHistories = {}; // { [peerId]: [messages] }
    let pendingRequest = null;
    let typingTimer = null;

    // Photo Upload Handler (Local file to DataURL)
    function handleDpUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          myProfile.avatar = e.target.result;
          localStorage.setItem('stranger_my_avatar', myProfile.avatar);
          document.getElementById('my-dp-preview').src = myProfile.avatar;
          // Sync with server immediately
          socket.emit('register_user', myProfile);
        };
        reader.readAsDataURL(file);
      }
    }

    socket.on('connect', () => {
      socket.emit('register_user', myProfile);
    });

    // Discovery Grid Render (500+ km support)
    socket.on('radar_sync', (allUsers) => {
      const grid = document.getElementById('discovery-grid');
      grid.innerHTML = '';

      const peers = allUsers.filter(u => u.id !== socket.id);

      peers.forEach((user, idx) => {
        const card = document.createElement('div');
        card.className = 'beside-card';
        card.innerHTML = `
          <div class="avatar-ring ${idx % 2 === 0 ? '' : 'alt-ring'}">
            <img src="${user.avatar}" alt="${user.name}">
          </div>
          <div class="user-title">${user.name}</div>
          <div class="user-dist">${user.distance} km away</div>
        `;
        card.onclick = () => {
          socket.emit('send_request', { targetId: user.id });
          alert(`Chat request sent to ${user.name} (${user.distance} km away)! Waiting for approval.`);
        };
        grid.appendChild(card);
      });
    });

    // Incoming Request
    socket.on('incoming_request', (data) => {
      pendingRequest = data;
      document.getElementById('req-user-name').innerText = data.fromName;
      document.getElementById('req-user-dist').innerText = `${data.distance} km away wants to chat`;
      document.getElementById('request-popup').classList.remove('hidden');
    });

    function answerRequest(accepted) {
      if (accepted) {
        socket.emit('accept_request', { requesterId: pendingRequest.fromId });
      } else {
        socket.emit('reject_request', { requesterId: pendingRequest.fromId });
      }
      document.getElementById('request-popup').classList.add('hidden');
    }

    socket.on('request_declined', (data) => {
      alert(`${data.peerName} declined the chat request.`);
    });

    // Private Session Created
    socket.on('session_established', (session) => {
      activeSession = session;
      if (!chatHistories[session.peerId]) chatHistories[session.peerId] = [];

      openChatScreen(session);
      renderChatsInbox();
    });

    function openChatScreen(session) {
      activeSession = session;
      document.getElementById('chat-peer-name').innerText = session.peerName;
      document.getElementById('chat-peer-dp').src = session.peerAvatar;

      renderCurrentChatMessages();

      document.getElementById('screen-discovery').classList.add('hidden');
      document.getElementById('screen-chats-list').classList.add('hidden');
      document.getElementById('screen-chat-room').classList.remove('hidden');
    }

    // Back Button (Returns back to active tab without closing session)
    function closeChatScreen() {
      document.getElementById('screen-chat-room').classList.add('hidden');
      switchMainTab('chats');
    }

    // Tab Switching
    function switchMainTab(tab) {
      document.getElementById('tab-nearby').classList.remove('active');
      document.getElementById('tab-chats').classList.remove('active');

      if (tab === 'nearby') {
        document.getElementById('tab-nearby').classList.add('active');
        document.getElementById('screen-discovery').classList.remove('hidden');
        document.getElementById('screen-chats-list').classList.add('hidden');
      } else {
        document.getElementById('tab-chats').classList.add('active');
        document.getElementById('screen-discovery').classList.add('hidden');
        document.getElementById('screen-chats-list').classList.remove('hidden');
        renderChatsInbox();
      }
    }

    function renderChatsInbox() {
      const container = document.getElementById('active-chats-container');
      if (!activeSession) return;

      container.innerHTML = `
        <div class="chat-inbox-item" onclick="openChatScreen(activeSession)">
          <img src="${activeSession.peerAvatar}">
          <div class="inbox-info">
            <div class="inbox-name">${activeSession.peerName}</div>
            <div class="inbox-sub">Click to resume private chat</div>
          </div>
          <span style="color:#06b6d4; font-size:12px;">Active</span>
        </div>
      `;
    }

    // Delete Chat Only For Me
    function deleteMyChatMessages() {
      if (confirm("Delete this conversation on your screen? (Other person will still see it)")) {
        if (activeSession) {
          chatHistories[activeSession.peerId] = [];
          renderCurrentChatMessages();
        }
      }
    }

    function renderCurrentChatMessages() {
      const flow = document.getElementById('chat-messages-flow');
      flow.innerHTML = `
        <div style="align-self:center; background:#1e293b; color:#38bdf8; font-size:11px; padding:6px 14px; border-radius:20px; border:1px solid #334155;">
          🔒 Private 1-to-1 Session (${activeSession ? activeSession.peerName : ''})
        </div>
      `;

      if (activeSession && chatHistories[activeSession.peerId]) {
        chatHistories[activeSession.peerId].forEach(msg => {
          appendBubbleToFlow(msg.dir, msg.content, msg.type, msg.time);
        });
      }
    }

    // Messaging
    function sendTextMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeSession) return;

      socket.emit('send_chat_message', {
        roomId: activeSession.roomId,
        targetId: activeSession.peerId,
        type: 'text',
        content: text
      });

      const msgObj = { dir: 'out', content: text, type: 'text', time: 'Now' };
      chatHistories[activeSession.peerId].push(msgObj);
      appendBubbleToFlow('out', text, 'text', 'Now');

      input.value = '';
      socket.emit('typing_status', { targetId: activeSession.peerId, isTyping: false });
    }

    function sendStickerDirect(url) {
      if (!activeSession) return;
      socket.emit('send_chat_message', {
        roomId: activeSession.roomId,
        targetId: activeSession.peerId,
        type: 'sticker',
        content: url
      });

      const msgObj = { dir: 'out', content: url, type: 'sticker', time: 'Now' };
      chatHistories[activeSession.peerId].push(msgObj);
      appendBubbleToFlow('out', url, 'sticker', 'Now');
      toggleStickersTray();
    }

    socket.on('receive_chat_message', (data) => {
      if (!chatHistories[data.senderId]) chatHistories[data.senderId] = [];

      const msgObj = { dir: 'in', content: data.content, type: data.type, time: data.timestamp };
      chatHistories[data.senderId].push(msgObj);

      if (activeSession && activeSession.peerId === data.senderId) {
        appendBubbleToFlow('in', data.content, data.type, data.timestamp);
      }
    });

    function appendBubbleToFlow(dir, content, type, time) {
      const flow = document.getElementById('chat-messages-flow');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${dir === 'out' ? 'bubble-out' : 'bubble-in'}`;

      if (type === 'sticker') {
        bubble.innerHTML = `<img src="${content}" class="bubble-sticker"><span class="bubble-time">${time}</span>`;
      } else {
        bubble.innerHTML = `<div>${content}</div><span class="bubble-time">${time}</span>`;
      }

      flow.appendChild(bubble);
      flow.scrollTop = flow.scrollHeight;
    }

    // Typing Status
    function handleTypingNotification() {
      if (!activeSession) return;
      socket.emit('typing_status', { targetId: activeSession.peerId, isTyping: true });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit('typing_status', { targetId: activeSession.peerId, isTyping: false });
      }, 1500);
    }

    socket.on('peer_typing', (data) => {
      const bar = document.getElementById('typing-bar');
      if (data.isTyping) bar.classList.remove('hidden');
      else bar.classList.add('hidden');
    });

    function toggleStickersTray() {
      document.getElementById('sticker-panel').classList.toggle('hidden');
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendTextMessage();
    }
  </script>
</body>
</html>
